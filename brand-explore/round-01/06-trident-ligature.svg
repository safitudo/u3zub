<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#fff"/>
  <!-- U -->
  <text x="60" y="170" font-family="'Arial Black', Impact, sans-serif"
        font-size="170" font-weight="900" fill="#000">U</text>
  <!-- 3 as trident: three prongs up + body -->
  <g transform="translate(195,30)">
    <!-- top three prongs -->
    <rect x="0"   y="0" width="14" height="60" fill="#000"/>
    <rect x="38"  y="-15" width="14" height="75" fill="#000"/>
    <rect x="76"  y="0" width="14" height="60" fill="#000"/>
    <!-- crossbar -->
    <rect x="-4" y="55" width="98" height="14" fill="#000"/>
    <!-- "3" body curve -->
    <path d="M 0 80 Q 100 80 100 110 Q 100 130 50 130 Q 100 130 100 160 Q 100 190 0 190"
          stroke="#000" stroke-width="22" fill="none" stroke-linecap="butt"/>
  </g>
  <text x="320" y="170" font-family="'Arial Black', Impact, sans-serif"
        font-size="170" font-weight="900" fill="#000">ZUB</text>
</svg>
