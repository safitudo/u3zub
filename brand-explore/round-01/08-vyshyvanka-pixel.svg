<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" shape-rendering="crispEdges">
  <rect width="600" height="220" fill="#fff"/>
  <g fill="#000">
    <!-- U (5x7 pixel @ 14px) -->
    <g transform="translate(40,50)">
      <rect x="0" y="0" width="14" height="84"/>
      <rect x="56" y="0" width="14" height="84"/>
      <rect x="14" y="70" width="42" height="14"/>
    </g>
    <!-- 3 -->
    <g transform="translate(150,50)">
      <rect x="0" y="0" width="70" height="14"/>
      <rect x="56" y="0" width="14" height="84"/>
      <rect x="14" y="35" width="42" height="14"/>
      <rect x="0" y="70" width="70" height="14"/>
    </g>
    <!-- Z -->
    <g transform="translate(260,50)">
      <rect x="0" y="0" width="70" height="14"/>
      <rect x="0" y="70" width="70" height="14"/>
      <rect x="42" y="14" width="14" height="14"/>
      <rect x="28" y="28" width="14" height="14"/>
      <rect x="14" y="42" width="14" height="14"/>
      <rect x="0" y="56" width="14" height="14"/>
    </g>
    <!-- U -->
    <g transform="translate(370,50)">
      <rect x="0" y="0" width="14" height="84"/>
      <rect x="56" y="0" width="14" height="84"/>
      <rect x="14" y="70" width="42" height="14"/>
    </g>
    <!-- B -->
    <g transform="translate(480,50)">
      <rect x="0" y="0" width="14" height="84"/>
      <rect x="0" y="0" width="56" height="14"/>
      <rect x="0" y="35" width="56" height="14"/>
      <rect x="0" y="70" width="56" height="14"/>
      <rect x="56" y="14" width="14" height="21"/>
      <rect x="56" y="49" width="14" height="21"/>
    </g>
    <!-- vyshyvanka top/bottom diamond border -->
    <g transform="translate(40,20)">
      <rect x="0" y="6" width="6" height="6"/>
      <rect x="12" y="0" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
      <rect x="6" y="6" width="6" height="6"/>
      <rect x="24" y="6" width="6" height="6"/>
    </g>
    <g transform="translate(540,20)">
      <rect x="0" y="6" width="6" height="6"/>
      <rect x="-12" y="0" width="6" height="6"/><rect x="-12" y="12" width="6" height="6"/>
      <rect x="-6" y="6" width="6" height="6"/>
      <rect x="-24" y="6" width="6" height="6"/>
    </g>
  </g>
</svg>
