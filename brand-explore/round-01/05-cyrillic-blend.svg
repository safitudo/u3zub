<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <rect width="600" height="200" fill="#fff"/>
  <!-- letters that read U/3/Z/U/B but echo Cyrillic У З У Б shapes -->
  <g font-family="'Times New Roman', Georgia, serif" font-size="170" font-weight="900" fill="#000">
    <text x="60"  y="155">У</text>
    <text x="160" y="155">З</text>
    <text x="260" y="155">U</text>
    <text x="360" y="155">B</text>
  </g>
  <text x="300" y="190" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="14" letter-spacing="6"
        fill="#000">U · 3 · Z · U · B</text>
</svg>
